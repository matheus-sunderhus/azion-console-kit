name: Run and Publish Release

on:
  push:
    branches:
      - main
      - dev
env:
    HUSKY: 0

jobs:
  publish-release:
    runs-on: self-hosted
    container:
      image: node:20-alpine3.20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install packages
        run: yarn ci

      - name: Install CI/CD Semantic Release plugins
        run: yarn add semantic-release @semantic-release/git @semantic-release/github @semantic-release/changelog @semantic-release/commit-analyzer @semantic-release/release-notes-generator --dev

      - name: Generate Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release